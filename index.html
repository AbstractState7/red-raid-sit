<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>RED RAID</title>

  <!-- Кнопка "входа" в CSS: открываем тег style внутри head -->
  <style>
    body {
      background-color: #121212; /* Наш темный фон */
         color: #e0e0e0;
      font-weight: bold;
      font-size: 20px;
      margin-top: 15px;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
    }

    /* Правило для шляпы: центрируем всё содержимое */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 0;
    }

    /* Правило для картинки: уменьшаем её до аккуратного размера */
    header img {
      width: 320px;      /* Поставили аккуратный размер */
      height: auto;
      margin-bottom: 15px;
    }

    h1 {
      color: #ff3333;
      margin: 0;
    }
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      opacity: 0.25;
    }
  </style> <!-- Закрываем CSS-код -->

</head>
<body>
<video src="./public/UntitledPK.mp4" autoplay loop muted playsinline class="bg-video"></video>

<header>
  <img src="./public/red_raid-removebg-preview.png" alt="Логотип RED RAID">
  <h1>PLAYER KILLER сообщество</h1>
  <p>СВОБОДА <b>«Голоса из унитаза»</b> Романтика</p>
</header>

<script type="module" src="/src/main.js"></script>
</body>
</html>
